<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>管理ページ | ANIME SEICHI DATA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="admin-body">
    <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">ASD</span><span>ANIME SEICHI<br />DATA</span></a><span class="admin-label">ADMIN ONLY</span></header>
    <main class="admin-main">
      <section class="admin-login" id="loginPanel">
        <p class="eyebrow">RESTRICTED AREA</p>
        <h1>管理者ログイン</h1>
        <p>承認された管理者だけが申請内容を確認できます。</p>
        <form id="authForm" class="auth-form">
          <label>メールアドレス<input name="email" type="email" required /></label>
          <label>パスワード<input name="password" type="password" required minlength="8" /></label>
          <div><button class="submit-button" type="submit">ログイン</button><button class="secondary-button" id="signUpButton" type="button">初回登録</button></div>
          <p class="form-status" id="authStatus" aria-live="polite"></p>
        </form>
      </section>
      <section class="admin-dashboard" id="dashboard" hidden>
        <div class="admin-heading"><div><p class="eyebrow">SUBMISSION REVIEW</p><h1>申請の確認</h1></div><button class="secondary-button" id="signOutButton" type="button">ログアウト</button></div>
        <div class="admin-tabs" id="reviewTabs"></div>
        <section id="spotReviewPanel">
          <div class="admin-tabs" id="statusTabs"></div>
          <p class="admin-status" id="adminStatus" aria-live="polite"></p>
          <div class="submission-list" id="submissionList"></div>
        </section>
        <section id="animeReviewPanel" hidden>
        <section class="anime-candidate-panel" aria-labelledby="animeCandidateHeading">
          <div class="admin-heading"><div><p class="eyebrow">WEEKLY ANIME INTAKE</p><h2 id="animeCandidateHeading">今季・直近放送の作品候補</h2></div><a class="secondary-button" href="https://anilist.co" target="_blank" rel="noopener">取得元：AniList / Jikan ↗</a></div>
          <p>毎週更新される候補です。過去作品も年・放送期を指定して取得できます。ここでは公開せず、調査する作品だけを「聖地調査キュー」に入れます。</p>
          <div class="anime-candidate-controls"><label>放送年<select id="animeCandidateYear"></select></label><label>放送期<select id="animeCandidateSeason"><option value="WINTER">冬（1〜3月）</option><option value="SPRING">春（4〜6月）</option><option value="SUMMER">夏（7〜9月）</option><option value="FALL">秋（10〜12月）</option></select></label><button class="secondary-button" id="loadAnimeCandidates" type="button">この期の候補を取得</button></div>
          <p class="admin-status" id="animeCandidateStatus" aria-live="polite"></p>
          <div class="anime-candidate-list" id="animeCandidateList"></div>
        </section>
        <section class="anime-queue-panel" aria-labelledby="animeQueueHeading">
          <div class="admin-heading"><div><p class="eyebrow">LOCATION RESEARCH QUEUE</p><h2 id="animeQueueHeading">聖地調査キュー</h2></div></div>
          <p class="admin-status" id="animeQueueStatus" aria-live="polite"></p>
          <div class="anime-queue-list" id="animeQueueList"></div>
        </section>
        </section>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="anime-candidates.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
