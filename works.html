<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="作品ごとにアニメ聖地を探せる一覧ページ" />
    <title>作品から探す | ANIME SEICHI DATA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="works-page">
    <header class="site-header works-header">
      <div class="header-top">
        <a class="brand" href="index.html" aria-label="ホームへ"><span class="brand-mark">ASD</span><span>ANIME SEICHI<br />DATA</span></a>
        <nav aria-label="メインナビゲーション"><a href="index.html#places" data-text="places">聖地を探す</a><a href="works.html" aria-current="page" data-text="works">作品から探す</a><a href="index.html#submission" data-text="submit">聖地申請</a></nav>
        <label class="language-control"><span>LANG</span><select id="worksLanguageSelect" aria-label="言語を選択"><option value="ja">日本語</option><option value="en">English</option></select></label>
        <button class="theme-toggle" id="worksThemeToggle" type="button" aria-label="ダークモードに切り替える"><span aria-hidden="true">☀</span><span id="worksThemeText">LIGHT MODE</span></button>
        <button class="mobile-menu-toggle" id="worksMenuToggle" type="button" aria-expanded="false" aria-controls="worksMobileMenu"><span>MENU</span><span aria-hidden="true">＋</span></button>
      </div>
      <nav class="works-mobile-menu" id="worksMobileMenu" aria-label="スマートフォンメニュー" hidden><a href="index.html#places" data-text="places">聖地を探す</a><a href="works.html" data-text="works">作品から探す</a><a href="index.html#submission" data-text="submit">聖地申請</a></nav>
    </header>

    <main class="works-main">
      <section class="works-intro">
        <p class="eyebrow">BROWSE BY ANIME</p>
        <h1 data-text="heading">作品から探す</h1>
        <p data-text="description">作品を選ぶと、その作品に登録されている聖地をまとめて確認できます。</p>
        <label class="works-search"><span aria-hidden="true">⌕</span><input id="worksSearch" type="search" autocomplete="off" placeholder="作品名を検索" /></label>
        <p class="works-result" id="worksResult" aria-live="polite"></p>
      </section>
      <section class="works-grid" id="worksGrid" aria-label="作品一覧"></section>
    </main>

    <footer><span>© 2026 ANIME SEICHI DATA</span><span data-text="footer">作品別データ一覧</span><a href="privacy.html">利用案内・プライバシー</a></footer>
    <dialog id="workDialog" class="place-dialog work-dialog">
      <button class="dialog-close" id="workDialogClose" type="button" aria-label="閉じる">×</button>
      <div id="workDialogContent"></div>
    </dialog>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="street-view.js"></script>
    <script src="data.js"></script>
    <script src="data-cleanup.js"></script>
    <script src="place-photos.js"></script>
    <script src="photo-discovery.js"></script>
    <script src="official-sources.js"></script>
    <script src="anime-artwork.js"></script>
    <script src="works.js"></script>
  </body>
</html>
